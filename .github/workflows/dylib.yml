name: dylib-build

on:
  push:
    branches: ["main"]
    paths: ["update/**", ".github/**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译弹窗 dylib (arm64 + arm64e)
        run: |
          set -e
          xcrun -sdk iphoneos clang -dynamiclib \
            update/UpdatePrompt.m -o UpdatePrompt.dylib \
            -arch arm64 -arch arm64e -fobjc-arc \
            -framework Foundation -framework UIKit \
            -miphoneos-version-min=13.0
          codesign -s - UpdatePrompt.dylib   # ad-hoc 自签,全能签可直接使用
          ls -lh UpdatePrompt.dylib
          file UpdatePrompt.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: UpdatePrompt-dylib
          path: UpdatePrompt.dylib
          if-no-files-found: error