name: template-build

on:
  push:
    branches: ["main"]
    paths: ["update_prompt_template/**", ".github/**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译弹窗模板 dylib (arm64 + arm64e, 不签名)
        run: |
          set -e
          xcrun -sdk iphoneos clang -dynamiclib \
            update_prompt_template/UpdatePromptTemplate.m -o UpdatePromptTemplate.dylib \
            -arch arm64 -arch arm64e -fobjc-arc \
            -framework Foundation -framework UIKit \
            -miphoneos-version-min=13.0
          # 故意不签名:生成器 App 做等宽字符串替换后签名会失效,
          # 无签名模板替换后直接可用,全能签注入时会统一重签整个 App
          ls -lh UpdatePromptTemplate.dylib
          file UpdatePromptTemplate.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: UpdatePromptTemplate-dylib
          path: UpdatePromptTemplate.dylib
          if-no-files-found: error
